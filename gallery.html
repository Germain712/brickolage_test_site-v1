<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Brick‑O‑Lage Construction</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="v3-header">
      <div class="v3-logo">
        <img src="imgs/logo.jpeg" alt="Brick‑O‑Lage Construction logo" />
        <span>Brick‑O‑Lage Construction</span>
      </div>

      <button
        class="v3-nav-toggle"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>

      <nav class="v3-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="v3-gallery">
        <h1>Project Gallery</h1>

        <div class="v3-gallery-grid">
          <img
            src="imgs/builders_concrete_building_progress.jpeg"
            alt="Construction"
          />
          <img
            src="imgs/en_suite_bathroom_top_floor.jpeg"
            alt="En suite bathroom in progress"
          />
          <img
            src="imgs/ground_floor_inside_progress-25-03-2025.jpeg"
            alt="Kitchen"
          />
          <img
            src="imgs/whole_view_ground_floor_not_done_yet.jpeg"
            alt="Coastal view"
          />
          <img
            src="imgs/side_of_building_progress_2-06-04-2026.jpeg"
            alt="Decorative blocks"
          />
        </div>
      </section>
    </main>

    <footer class="v3-footer">
      <p>&copy; <span id="year"></span> Brick‑O‑Lage Construction</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
